; ESP32 hardware sanity test (see README.md).
; Normally run through sanity_test.py, which flashes and checks the output.
; By hand (pio is ~/.platformio/penv/bin/pio):
;   Build:            pio run
;   Flash one board:  pio run -t upload --upload-port /dev/ttyUSB0
;   Watch its output: pio device monitor --port /dev/ttyUSB0
; No fixed port here: /dev/ttyUSB numbers change when a board is replugged.

[env:esp32dev]
; Pinned to the installed version (Arduino core 3.3, ESP-IDF 5.5),
; so the sketch keeps building the same way
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

; Serial speed (must match Serial.begin in src/main.cpp)
monitor_speed = 115200
