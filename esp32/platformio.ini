; PlatformIO project for the ESP32 fog clients.
; Build and upload:  pio run -t upload
; Serial monitor:    pio device monitor
; Another client id: PLATFORMIO_BUILD_FLAGS="-DCLIENT_ID=2" pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial port and speed (must match Serial.begin in main.cpp)
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
