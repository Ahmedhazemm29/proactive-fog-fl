; PlatformIO project for the ESP32 fog clients. Two firmwares:
;   fl      (default) federated learning client, src/fl/
;   sensor  publishes sensor values at a live rate, src/sensor/
;
; Build and upload the FL client:  pio run -t upload
; Another board:                   pio run -t upload --upload-port /dev/ttyUSB3
; The sensor firmware:             pio run -e sensor -t upload
; Serial monitor:                  pio device monitor
;
; Every FL board takes its client ID from its own MAC, so all boards get
; the same firmware. The sensor firmware's id is set at build time:
;   PLATFORMIO_BUILD_FLAGS="-DCLIENT_ID=2" pio run -e sensor -t upload

[platformio]
default_envs = fl

; Settings shared by both firmwares
[env]
platform = espressif32
board = esp32dev
framework = arduino

; Serial port and speed (must match Serial.begin in main.cpp)
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8

[env:fl]
build_src_filter = +<fl/>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2

[env:sensor]
build_src_filter = +<sensor/>

; Secure-aggregation benchmark for one board (not an FL client): times the
; client side of pairwise masking and Paillier, see src/secagg_bench/main.cpp
;   pio run -e secagg_bench -t upload --upload-port /dev/ttyUSB0
[env:secagg_bench]
build_src_filter = +<secagg_bench/>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2
