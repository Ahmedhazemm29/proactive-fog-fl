name: thesis-autoscaler

services:
  # ---------- Workload (the thing we allocate resources to) ----------
  worker-1:
    build: ./workload
    image: thesis/worker:latest
    container_name: fl-worker-1
    labels:
      thesis.role: "worker"
    # Use period/quota (not "cpus") so the controller can update it later
    cpu_period: 100000
    cpu_quota: 50000        # 0.5 CPU starting budget
    mem_limit: 512m
    environment:
      # This worker's load profile, re-read every second (see scripts/set_load.py)
      LOAD_FILE: /load/fl-worker-1.json
    volumes:
      # The whole folder, not single files: set_load.py replaces files by
      # renaming, which a single-file mount would not see.
      - ./load:/load:ro
    restart: unless-stopped

  worker-2:
    image: thesis/worker:latest
    container_name: fl-worker-2
    labels:
      thesis.role: "worker"
    cpu_period: 100000
    cpu_quota: 50000        # 0.5 CPU starting budget
    mem_limit: 512m
    environment:
      LOAD_FILE: /load/fl-worker-2.json
    volumes:
      - ./load:/load:ro
    restart: unless-stopped

  # ---------- Monitoring stack ----------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    # "command" replaces the image's default flags, so the first four lines
    # repeat those defaults unchanged. The last one is new: keep data for a
    # year instead of the default 15 days, so experiment runs are not deleted.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=1y
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The demo dashboards, loaded by provisioning/dashboards/demo.yml. Only these
      # files: proactive-autoscaling.json is an export of a dashboard that lives
      # in grafana-data with the same uid, and loading it would overwrite and
      # lock that one.
      # Tools that replace the file (git checkout, sed -i) are only seen after
      # `docker restart grafana`; editing it in place is picked up within 10 s.
      - ./monitoring/grafana/dashboards/demo.json:/etc/grafana/dashboards/demo.json:ro
      # The live autoscaler demo of step 4B (docs/demo_live.md)
      - ./monitoring/grafana/dashboards/autoscaler-live.json:/etc/grafana/dashboards/autoscaler-live.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
