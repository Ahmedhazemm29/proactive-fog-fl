name: thesis-autoscaler

services:
  # ---------- Workload (the thing we allocate resources to) ----------
  worker-1:
    build: ./workload
    image: thesis/worker:latest
    container_name: fl-worker-1
    labels:
      thesis.role: "worker"
    # Use period/quota (not "cpus") so the controller can update it later
    cpu_period: 100000
    cpu_quota: 50000        # 0.5 CPU starting budget
    mem_limit: 512m
    environment:
      # This worker's load profile, re-read every second (see scripts/set_load.py)
      LOAD_FILE: /load/fl-worker-1.json
    volumes:
      # The whole folder, not single files: set_load.py replaces files by
      # renaming, which a single-file mount would not see.
      - ./load:/load:ro
    restart: unless-stopped

  worker-2:
    image: thesis/worker:latest
    container_name: fl-worker-2
    labels:
      thesis.role: "worker"
    cpu_period: 100000
    cpu_quota: 50000        # 0.5 CPU starting budget
    mem_limit: 512m
    environment:
      LOAD_FILE: /load/fl-worker-2.json
    volumes:
      - ./load:/load:ro
    restart: unless-stopped

  # ---------- Monitoring stack ----------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
